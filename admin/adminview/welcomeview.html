<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>About Section View</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:Arial, sans-serif;
      background:#f4f4f4;
      padding:20px;
    }

    .student-list{
      background:white;
      padding:20px;
      border-radius:8px;
      box-shadow:0 2px 5px rgba(0,0,0,0.2);
    }

    h2{
      text-align:center;
      margin-bottom:20px;
    }

    table{
      width:100%;
      margin-top:20px;
      border-collapse:collapse;
    }

    th,
    td{
      border:1px solid #ddd;
      padding:10px;
      text-align:center;
    }

    th{
      background:rgb(48, 227, 215);
    }

    img{
      width:120px;
      height:80px;
      object-fit:cover;
      border-radius:5px;
    }

    button{
      padding:8px 12px;
      border:none;
      border-radius:4px;
      cursor:pointer;
      color:white;
    }

    .btn-edit{
      background:#007bff;
      margin-right:5px;
    }

    .btn-delete{
      background:#dc3545;
    }

    .btn-edit:hover{
      background:#0056b3;
    }

    .btn-delete:hover{
      background:#a71d2a;
    }

    .addmore{
      display:inline-block;
      background:aqua;
      padding:15px 20px;
      color:black;
      text-decoration:none;
      border-radius:5px;
      margin-bottom:20px;
    }
    
    .viewwelcome{
      display:inline-block;
      background:rgb(48, 227, 215);
      padding:15px 20px;
      color:black;
      text-decoration:none;
      border-radius:5px;
      margin-bottom:20px;
    }

    #message{
      text-align:center;
      margin-top:10px;
      font-weight:bold;
    }

    /* MODAL */

    .modal{
      display:none;
      position:fixed;
      z-index:1000;
      left:0;
      top:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.6);
      justify-content:center;
      align-items:center;
    }

    .modal-content{
      background:white;
      width:700px;
      max-width:95%;
      max-height:90vh;
      overflow-y:auto;
      padding:25px;
      border-radius:10px;
      position:relative;
      animation:popup 0.3s ease;
    }

    @keyframes popup{

      from{
        transform:scale(0.8);
        opacity:0;
      }

      to{
        transform:scale(1);
        opacity:1;
      }
    }

    .close-btn{
      position:absolute;
      top:12px;
      right:18px;
      font-size:24px;
      cursor:pointer;
      color:#444;
    }

    .close-btn:hover{
      color:red;
    }

    .form-group{
      margin-bottom:18px;
    }

    .form-group label{
      display:block;
      margin-bottom:8px;
      font-weight:bold;
    }

    .form-group input,
    .form-group textarea{
      width:100%;
      padding:10px;
      border:1px solid #ccc;
      border-radius:6px;
      outline:none;
    }

    .form-group textarea{
      resize:vertical;
      height:100px;
    }

    .image-preview img{
      width:200px;
      height:120px;
      object-fit:cover;
      border-radius:8px;
      margin-top:10px;
    }

    .update-btn{
      width:100%;
      padding:12px;
      background:#007bff;
      border:none;
      color:white;
      border-radius:6px;
      font-size:16px;
      cursor:pointer;
    }

    .update-btn:hover{
      background:#0056b3;
    }

  </style>
  <link rel="stylesheet" href="../css/admin-view.css">

</head>

<body>

  <div class="student-list">

    <a class="addmore" href="../welcomesection.html">
      Add New Welcome Section
    </a>

    
    <a class="viewwelcome" href="/index.html#welcome">
      view welcome section
    </a>

    <h2>Registered Welcome Sections</h2>

    <p id="message"></p>

    <table>

      <thead>

        <tr>
          <th>ID</th>
          <th>Heading</th>
          <th>Highlight</th>
          <th>Phone</th>
          <th>Image One</th>
          <th>Image Two</th>
          <th>Actions</th>
        </tr>

      </thead>

      <tbody id="aboutBody">

        <tr>
          <td colspan="7">
            Loading About Sections...
          </td>
        </tr>

      </tbody>

    </table>

  </div>

  <!-- MODAL -->

  <div class="modal" id="editModal">

    <div class="modal-content">

      <span class="close-btn" onclick="closeModal()">
        &times;
      </span>

      <h2>Edit About Section</h2>

      <form id="aboutEditForm" enctype="multipart/form-data">

        <div class="form-group">
          <label>Heading</label>

          <input
            type="text"
            id="heading"
            name="heading"
            required
          >
        </div>

        <div class="form-group">
          <label>Highlight</label>

          <input
            type="text"
            id="highlight"
            name="highlight"
          >
        </div>

        <div class="form-group">
          <label>Description One</label>

          <textarea
            id="description_one"
            name="description_one"
          ></textarea>
        </div>

        <div class="form-group">
          <label>CTA Text</label>

          <input
            type="text"
            id="cta_text"
            name="cta_text"
          >
        </div>

        <div class="form-group">
          <label>CTA Link</label>

          <input
            type="text"
            id="cta_href"
            name="cta_href"
          >
        </div>

        <div class="form-group">
          <label>Description Two</label>

          <textarea
            id="description_two"
            name="description_two"
          ></textarea>
        </div>

        <div class="form-group">
          <label>Note</label>

          <textarea
            id="note"
            name="note"
          ></textarea>
        </div>

        <div class="form-group">
          <label>Phone Label</label>

          <input
            type="text"
            id="phone_label"
            name="phone_label"
          >
        </div>

        <div class="form-group">
          <label>Phone Value</label>

          <input
            type="text"
            id="phone_value"
            name="phone_value"
          >
        </div>

        <div class="form-group">
          <label>Support Label</label>

          <input
            type="text"
            id="support_label"
            name="support_label"
          >
        </div>

        <div class="form-group">
          <label>Support Value</label>

          <input
            type="text"
            id="support_value"
            name="support_value"
          >
        </div>

        <!-- IMAGE ONE -->

        <div class="form-group">

          <label>Current Image One</label>

          <div
            id="currentImageOne"
            class="image-preview"
          >
            No image uploaded
          </div>

        </div>

        <div class="form-group">

          <label>Change Image One</label>

          <input
            type="file"
            id="image_one"
            name="image_one"
            accept="image/*"
          >

        </div>

        <!-- IMAGE TWO -->

        <div class="form-group">

          <label>Current Image Two</label>

          <div
            id="currentImageTwo"
            class="image-preview"
          >
            No image uploaded
          </div>

        </div>

        <div class="form-group">

          <label>Change Image Two</label>

          <input
            type="file"
            id="image_two"
            name="image_two"
            accept="image/*"
          >

        </div>

        <button
          type="submit"
          class="update-btn"
        >
          Update About Section
        </button>

      </form>

    </div>

  </div>

  <script>

    const aboutBody =
      document.getElementById("aboutBody");

    const message =
      document.getElementById("message");

    const editModal =
      document.getElementById("editModal");

    const aboutForm =
      document.getElementById("aboutEditForm");

    let currentAboutId = null;

    function aboutImage(src, heading){

      if(!src){
        return "No Image";
      }

      return `
        <img src="${src}" alt="${heading}">
      `;
    }

    async function loadAboutSections(){

      aboutBody.innerHTML = `
        <tr>
          <td colspan="7">
            Loading About Sections...
          </td>
        </tr>
      `;

      try{

        const response =
          await fetch("/about-section");

        if(!response.ok){
          throw new Error(
            "Failed to fetch about sections"
          );
        }

        const abouts =
          await response.json();

        aboutBody.innerHTML = "";

        if(!abouts){

          aboutBody.innerHTML = `
            <tr>
              <td colspan="7">
                No About Section Found
              </td>
            </tr>
          `;

          return;
        }

        const aboutArray = Array.isArray(abouts)
          ? abouts
          : [abouts];

        aboutArray.forEach((about) => {

          const row =
            document.createElement("tr");

          row.innerHTML = `
          
            <td>${about.id}</td>

            <td>${about.heading || ""}</td>

            <td>${about.highlight || ""}</td>

            <td>${about.phone_value || ""}</td>

            <td>
              ${aboutImage(
                about.image_one,
                about.heading
              )}
            </td>

            <td>
              ${aboutImage(
                about.image_two,
                about.heading
              )}
            </td>

            <td>

              <button
                class="btn-edit"
                onclick="editAbout(${about.id})"
              >
                Edit
              </button>

              <button
                class="btn-delete"
                onclick="deleteAbout(${about.id})"
              >
                Delete
              </button>

            </td>

          `;

          aboutBody.appendChild(row);

        });

      }catch(error){

        console.error(error);

        aboutBody.innerHTML = `
          <tr>
            <td colspan="7">
              Error Loading About Sections
            </td>
          </tr>
        `;
      }
    }

    async function editAbout(id){

      currentAboutId = id;

      editModal.style.display = "flex";

      try{

        const response =
          await fetch(`/about-section/${id}`);

        const about =
          await response.json();

        document.getElementById("heading").value =
          about.heading || "";

        document.getElementById("highlight").value =
          about.highlight || "";

        document.getElementById("description_one").value =
          about.description_one || "";

        document.getElementById("cta_text").value =
          about.cta_text || "";

        document.getElementById("cta_href").value =
          about.cta_href || "";

        document.getElementById("description_two").value =
          about.description_two || "";

        document.getElementById("note").value =
          about.note || "";

        document.getElementById("phone_label").value =
          about.phone_label || "";

        document.getElementById("phone_value").value =
          about.phone_value || "";

        document.getElementById("support_label").value =
          about.support_label || "";

        document.getElementById("support_value").value =
          about.support_value || "";

        const currentImageOne =
          document.getElementById(
            "currentImageOne"
          );

        const currentImageTwo =
          document.getElementById(
            "currentImageTwo"
          );

        if(about.image_one){

          currentImageOne.innerHTML = `
            <img src="${about.image_one}">
          `;

        }else{

          currentImageOne.innerHTML =
            "No image uploaded";
        }

        if(about.image_two){

          currentImageTwo.innerHTML = `
            <img src="${about.image_two}">
          `;

        }else{

          currentImageTwo.innerHTML =
            "No image uploaded";
        }

      }catch(error){

        console.error(error);

        message.textContent =
          "Error loading about section";
      }
    }

    function closeModal(){

      editModal.style.display = "none";
    }

    aboutForm.addEventListener(
      "submit",
      async (e) => {

        e.preventDefault();

        const formData =
          new FormData();

        formData.append(
          "heading",
          document.getElementById("heading")
            .value.trim()
        );

        formData.append(
          "highlight",
          document.getElementById("highlight")
            .value.trim()
        );

        formData.append(
          "description_one",
          document.getElementById(
            "description_one"
          ).value.trim()
        );

        formData.append(
          "cta_text",
          document.getElementById(
            "cta_text"
          ).value.trim()
        );

        formData.append(
          "cta_href",
          document.getElementById(
            "cta_href"
          ).value.trim()
        );

        formData.append(
          "description_two",
          document.getElementById(
            "description_two"
          ).value.trim()
        );

        formData.append(
          "note",
          document.getElementById(
            "note"
          ).value.trim()
        );

        formData.append(
          "phone_label",
          document.getElementById(
            "phone_label"
          ).value.trim()
        );

        formData.append(
          "phone_value",
          document.getElementById(
            "phone_value"
          ).value.trim()
        );

        formData.append(
          "support_label",
          document.getElementById(
            "support_label"
          ).value.trim()
        );

        formData.append(
          "support_value",
          document.getElementById(
            "support_value"
          ).value.trim()
        );

        const imageOne =
          document.getElementById(
            "image_one"
          ).files[0];

        const imageTwo =
          document.getElementById(
            "image_two"
          ).files[0];

        if(imageOne){

          formData.append(
            "image_one",
            imageOne
          );
        }

        if(imageTwo){

          formData.append(
            "image_two",
            imageTwo
          );
        }

        try{

          const response =
            await fetch(
              `/about-section/${currentAboutId}`,
              {
                method:"PUT",
                body:formData
              }
            );

          const data =
            await response.json();

          if(response.ok){

            message.textContent =
              "About section updated successfully";

            closeModal();

            loadAboutSections();

          }else{

            message.textContent =
              data.message || "Update failed";
          }

        }catch(error){

          console.error(error);

          message.textContent =
            "Error updating about section";
        }

      }
    );

    async function deleteAbout(id){

      const confirmDelete = confirm(
        "Are you sure you want to delete this about section?"
      );

      if(!confirmDelete) return;

      try{

        const response =
          await fetch(
            `/about-section/${id}`,
            {
              method:"DELETE"
            }
          );

        const data =
          await response.json();

        if(response.ok){

          message.textContent =
            data.message;

          loadAboutSections();

        }else{

          message.textContent =
            data.message || "Delete failed";
        }

      }catch(error){

        console.error(error);

        message.textContent =
          "Error deleting about section";
      }
    }

    window.onclick = function(e){

      if(e.target === editModal){

        closeModal();
      }
    };

    loadAboutSections();

  </script>

</body>

</html>
