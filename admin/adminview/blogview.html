<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Blog View</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 20px;
    }

    .student-list {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }

    th {
      background: #8eb7e6;
    }

    img {
      width: 120px;
      height: 70px;
      object-fit: cover;
      border-radius: 5px;
    }

    button {
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      color: white;
    }

    .btn-edit {
      background: #007bff;
      margin-right: 5px;
    }

    .btn-delete {
      background: #dc3545;
    }

    .btn-edit:hover {
      background: #0056b3;
    }

    .btn-delete:hover {
      background: #a71d2a;
    }

    .addmore {
      display: inline-block;
      padding: 12px 18px;
      background: aqua;
      color: black;
      text-decoration: none;
      border-radius: 5px;
      margin-bottom: 20px;
    }
    
    .viewpage {
      display: inline-block;
      justify-content: center;
      padding: 12px 18px;
      background: rgb(240, 244, 9);
      color: black;
      text-decoration: none;
      border-radius: 5px;
      margin-bottom: 20px;
    }

    #message {
      text-align: center;
      margin-top: 10px;
      font-weight: bold;
    }

    /* MODAL */

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      width: 500px;
      max-width: 90%;
      padding: 25px;
      border-radius: 10px;
      position: relative;
      animation: popup 0.3s ease;
    }

    @keyframes popup {
      from {
        transform: scale(0.8);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .close-btn {
      position: absolute;
      top: 12px;
      right: 18px;
      font-size: 24px;
      cursor: pointer;
      color: #444;
    }

    .close-btn:hover {
      color: red;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
    }

    .form-group textarea {
      resize: vertical;
      height: 100px;
    }

    .update-btn {
      width: 100%;
      padding: 12px;
      background: #007bff;
      border: none;
      color: white;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    .update-btn:hover {
      background: #0056b3;
    }
  </style>
  <link rel="stylesheet" href="../css/admin-view.css">
</head>

<body>

  <div class="student-list">

    <a class="addmore" href="../blog.html">
      Add More Blogs
    </a>
<a class="viewpage" href="/index.html#blog">Back to Blog
   view page </a>
    <h2>Registered Blogs</h2>

    <p id="message"></p>

    <table>

      <thead>
        <tr>
          <th>ID</th>
          <th>Title</th>
          <th>Category</th>
          <th>Description</th>
          <th>Button Text</th>
          <th>Blog Date</th>
          <th>Image</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody id="blogsBody">
        <tr>
          <td colspan="8">Loading Blogs...</td>
        </tr>
      </tbody>

    </table>

  </div>

  <!-- MODAL -->

  <div class="modal" id="editModal">

    <div class="modal-content">

      <span class="close-btn" onclick="closeModal()">
        &times;
      </span>

      <h2>Edit Blog</h2>

      <form id="blogEditForm" enctype="multipart/form-data">

        <div class="form-group">
          <label>Title</label>

          <input
            type="text"
            id="title"
            name="title"
            required
          >
        </div>

        <div class="form-group">
          <label>Category</label>

          <input
            type="text"
            id="category"
            name="category"
          >
        </div>

        <div class="form-group">
          <label>Description</label>

          <textarea
            id="description"
            name="description"
          ></textarea>
        </div>

        <div class="form-group">
          <label>Button Text</label>

          <input
            type="text"
            id="buttontext"
            name="buttontext"
          >
        </div>

        <div class="form-group">
          <label>Blog Date</label>

          <input
            type="text"
            id="blogdate"
            name="blogdate"
          >
        </div>

        <div class="form-group">

          <label>Current Image</label>

          <div id="currentImage">
            No image uploaded
          </div>

        </div>

        <div class="form-group">

          <label>Change Blog Image</label>

          <input
            type="file"
            id="blog_image"
            name="blog_image"
            accept="image/*"
          >

        </div>

        <button type="submit" class="update-btn">
          Update Blog
        </button>

      </form>

    </div>

  </div>

  <script>

    const blogsBody = document.getElementById("blogsBody");

    const message = document.getElementById("message");

    const editModal =
      document.getElementById("editModal");

    const blogForm =
      document.getElementById("blogEditForm");

    let currentBlogId = null;

    function blogImage(src, title) {

      if (!src) {
        return "No Image";
      }

      return `
        <img src="${src}" alt="${title}">
      `;
    }

    async function loadBlogs() {

      blogsBody.innerHTML = `
        <tr>
          <td colspan="8">Loading Blogs...</td>
        </tr>
      `;

      try {

        const response = await fetch("/blogs");

        if (!response.ok) {
          throw new Error("Failed to fetch blogs");
        }

        const blogs = await response.json();

        blogsBody.innerHTML = "";

        if (blogs.length === 0) {

          blogsBody.innerHTML = `
            <tr>
              <td colspan="8">No Blogs Found</td>
            </tr>
          `;

          return;
        }

        blogs.forEach((blog) => {

          const row = document.createElement("tr");

          row.innerHTML = `
            <td>${blog.id}</td>

            <td>${blog.title || ""}</td>

            <td>${blog.category || ""}</td>

            <td>${blog.description || ""}</td>

            <td>${blog.buttontext || ""}</td>

            <td>${blog.blogdate || ""}</td>

            <td>
              ${blogImage(blog.image, blog.title)}
            </td>

            <td>

              <button 
                class="btn-edit"
                onclick="editBlog(${blog.id})"
              >
                Edit
              </button>

              <button 
                class="btn-delete"
                onclick="deleteBlog(${blog.id})"
              >
                Delete
              </button>

            </td>
          `;

          blogsBody.appendChild(row);

        });

      } catch (error) {

        console.error(error);

        blogsBody.innerHTML = `
          <tr>
            <td colspan="8">
              Error Loading Blogs
            </td>
          </tr>
        `;
      }
    }

    async function editBlog(id) {

      currentBlogId = id;

      editModal.style.display = "flex";

      try {

        const response =
          await fetch(`/blogs/${id}`);

        const blog = await response.json();

        document.getElementById("title").value =
          blog.title || "";

        document.getElementById("category").value =
          blog.category || "";

        document.getElementById("description").value =
          blog.description || "";

        document.getElementById("buttontext").value =
          blog.buttontext || "";

        document.getElementById("blogdate").value =
          blog.blogdate || "";

        const currentImage =
          document.getElementById("currentImage");

        if (blog.image) {

          currentImage.innerHTML = `
            <img 
              src="${blog.image}"
              style="
                width:200px;
                height:120px;
                border-radius:8px;
              "
            >
          `;

        } else {

          currentImage.innerHTML =
            "No image uploaded";
        }

      } catch (error) {

        console.error(error);

        message.textContent =
          "Error loading blog details";
      }
    }

    function closeModal() {

      editModal.style.display = "none";
    }

    blogForm.addEventListener("submit", async (e) => {

      e.preventDefault();

      const formData = new FormData();

      formData.append(
        "title",
        document.getElementById("title").value.trim()
      );

      formData.append(
        "category",
        document.getElementById("category").value.trim()
      );

      formData.append(
        "description",
        document.getElementById("description").value.trim()
      );

      formData.append(
        "buttontext",
        document.getElementById("buttontext").value.trim()
      );

      formData.append(
        "blogdate",
        document.getElementById("blogdate").value.trim()
      );

      const imageFile =
        document.getElementById("blog_image").files[0];

      if (imageFile) {

        formData.append(
          "blog_image",
          imageFile
        );
      }

      try {

        const response = await fetch(
          `/blogs/${currentBlogId}`,
          {
            method: "PUT",
            body: formData
          }
        );

        const data = await response.json();

        if (response.ok) {

          message.textContent =
            "Blog updated successfully";

          closeModal();

          loadBlogs();

        } else {

          message.textContent =
            data.message || "Update failed";
        }

      } catch (error) {

        console.error(error);

        message.textContent =
          "Error updating blog";
      }

    });

    async function deleteBlog(id) {

      const confirmDelete = confirm(
        "Are you sure you want to delete this blog?"
      );

      if (!confirmDelete) return;

      try {

        const response = await fetch(
          `/blogs/${id}`,
          {
            method: "DELETE"
          }
        );

        const data = await response.json();

        if (response.ok) {

          message.textContent = data.message;

          loadBlogs();

        } else {

          message.textContent =
            data.message || "Delete failed";
        }

      } catch (error) {

        console.error(error);

        message.textContent =
          "Error deleting blog";
      }
    }

    window.onclick = function (e) {

      if (e.target === editModal) {

        closeModal();
      }
    };

    loadBlogs();

  </script>

</body>

</html>
