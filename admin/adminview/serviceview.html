<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Service View</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 20px;
    }

    .student-list {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }

    th {
      background: #8eb7e6;
    }

    img {
      width: 120px;
      height: 70px;
      object-fit: cover;
      border-radius: 5px;
    }

    button {
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      color: white;
    }

    .btn-edit {
      background: #007bff;
      margin-right: 5px;
    }

    .btn-delete {
      background: #dc3545;
    }

    .addmore {
      display: inline-block;
      padding: 12px 18px;
      background: aqua;
      color: black;
      text-decoration: none;
      border-radius: 5px;
      margin-bottom: 20px;
    }

    .viewservice {
      display: inline-block;
      padding: 12px 18px;
      background: rgb(237, 198, 6);
      color: black;
      text-decoration: none;
      border-radius: 5px;
      margin-bottom: 20px;
    }

    #message {
      text-align: center;
      margin-top: 10px;
      font-weight: bold;
    }

    /* MODAL */

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      width: 500px;
      max-width: 90%;
      padding: 25px;
      border-radius: 10px;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 12px;
      right: 18px;
      font-size: 24px;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .update-btn {
      width: 100%;
      padding: 12px;
      background: #007bff;
      border: none;
      color: white;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
  <link rel="stylesheet" href="../css/admin-view.css">
</head>

<body>

  <div class="student-list">

    <a class="addmore" href="../service.html">
      Add more services
    </a>

    
    <a class="viewservice" href="/index.html#services">
      view service section
    </a>


    <h2>Services Data</h2>

    <p id="message"></p>

    <table>

      <thead>
        <tr>
          <th>ID</th>
          <th>Title</th>
          <th>Description</th>
          <th>Image</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody id="servicesBody">
        <tr>
          <td colspan="5">Loading Services...</td>
        </tr>
      </tbody>

    </table>

  </div>

  <!-- MODAL -->

  <div class="modal" id="editModal">

    <div class="modal-content">

      <span class="close-btn" onclick="closeModal()">
        &times;
      </span>

      <h2>Edit Service</h2>

      <form id="serviceEditForm" enctype="multipart/form-data">

        <div class="form-group">
          <label>Title</label>

          <input
            type="text"
            id="title"
            required
          >
        </div>

        <div class="form-group">
          <label>Button Text</label>

          <input
            type="text"
            id="buttontext"
          >
        </div>

        <div class="form-group">
          <label>Description</label>

          <textarea
            id="description"
            required
          ></textarea>
        </div>

        <div class="form-group">

          <label>Current Image</label>

          <div id="currentImage">
            No image uploaded
          </div>

        </div>

        <div class="form-group">

          <label>Change Image</label>

          <input
            type="file"
            id="service_image"
            accept="image/*"
          >

        </div>

        <button type="submit" class="update-btn">
          Update Service
        </button>

      </form>

    </div>

  </div>

  <script>

    const servicesBody =
      document.getElementById("servicesBody");

    const message =
      document.getElementById("message");

    const editmodal =
      document.getElementById("editModal");

    const serviceform =
      document.getElementById("serviceEditForm");

    let currentserviceid = null;

    function serviceImage(src, name) {

      if (!src) {
        return "No Image";
      }

      return `
        <img src="${src}" alt="${name}">
      `;
    }

    async function loadServices() {

      servicesBody.innerHTML = `
        <tr>
          <td colspan="5">
            Loading Services...
          </td>
        </tr>
      `;

      try {

        const response =
          await fetch("/services");

        if (!response.ok) {
          throw new Error("Failed to load services");
        }

        const services =
          await response.json();

        servicesBody.innerHTML = "";

        if (services.length === 0) {

          servicesBody.innerHTML = `
            <tr>
              <td colspan="5">
                No Services Found
              </td>
            </tr>
          `;

          return;
        }

        services.forEach((service) => {

          const row =
            document.createElement("tr");

          row.innerHTML = `
            <td>${service.id}</td>

            <td>${service.title || ""}</td>

            <td>${service.description || ""}</td>

            <td>
              ${serviceImage(service.image, service.title)}
            </td>

            <td>

              <button
                class="btn-edit"
                onclick="Editservice(${service.id})"
              >
                Edit
              </button>

              <button
                class="btn-delete"
                onclick="deleteService(${service.id})"
              >
                Delete
              </button>

            </td>
          `;

          servicesBody.appendChild(row);

        });

      } catch (error) {

        console.error(error);

        servicesBody.innerHTML = `
          <tr>
            <td colspan="5">
              Error loading services
            </td>
          </tr>
        `;
      }
    }

    async function Editservice(id) {

      currentserviceid = id;

      editmodal.style.display = "flex";

      try {

        const response =
          await fetch(`/services/${id}`);

        const service =
          await response.json();

        document.getElementById("title").value =
          service.title || "";

        document.getElementById("buttontext").value =
          service.buttontext || "";

        document.getElementById("description").value =
          service.description || "";

        const currentImageDiv =
          document.getElementById("currentImage");

        if (service.image) {

          currentImageDiv.innerHTML = `
            <img
              src="${service.image}"
              width="200"
            >
          `;

        } else {

          currentImageDiv.innerHTML =
            "No image uploaded";
        }

      } catch (error) {

        console.error(error);

        message.textContent =
          "Error loading service";
      }
    }

    function closeModal() {

      editmodal.style.display = "none";
    }

    serviceform.addEventListener("submit", async (e) => {

      e.preventDefault();

      const formData = new FormData();

      formData.append(
        "title",
        document.getElementById("title").value.trim()
      );

      formData.append(
        "buttontext",
        document.getElementById("buttontext").value.trim()
      );

      formData.append(
        "description",
        document.getElementById("description").value.trim()
      );

      const imagefile =
        document.getElementById("service_image").files[0];

      if (imagefile) {

        formData.append(
          "service_image",
          imagefile
        );
      }

      try {

        const response = await fetch(
          `/services/${currentserviceid}`,
          {
            method: "PUT",
            body: formData
          }
        );

        const data =
          await response.json();

        if (response.ok) {

          message.textContent =
            data.message;

          closeModal();

          loadServices();

        } else {

          message.textContent =
            data.message || "Update failed";
        }

      } catch (error) {

        console.error(error);

        message.textContent =
          "Error updating service";
      }

    });

    async function deleteService(id) {

      const confirmDelete = confirm(
        "Are you sure you want to delete this service?"
      );

      if (!confirmDelete) return;

      try {

        const response = await fetch(
          `/services/${id}`,
          {
            method: "DELETE"
          }
        );

        const data =
          await response.json();

        if (response.ok) {

          message.textContent =
            data.message;

          loadServices();

        } else {

          message.textContent =
            data.message || "Delete failed";
        }

      } catch (error) {

        console.error(error);

        message.textContent =
          "Error deleting service";
      }
    }

    window.onclick = function (event) {

      if (event.target === editmodal) {

        closeModal();
      }
    };

    loadServices();

  </script>

</body>

</html>
