<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Trusted Brands View</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 20px;
    }

    .student-list {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }

    th {
      background: #8eb7e6;
    }

    img {
      width: 120px;
      height: 70px;
      object-fit: cover;
      border-radius: 5px;
    }

    button {
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      color: white;
    }

    .btn-edit {
      background: #007bff;
      margin-right: 5px;
    }

    .btn-delete {
      background: #dc3545;
    }

    .btn-edit:hover {
      background: #0056b3;
    }

    .btn-delete:hover {
      background: #a71d2a;
    }

    .addmore {
      display: inline-block;
      background-color: aqua;
      padding: 15px 20px;
      color: black;
      text-decoration: none;
      border-radius: 5px;
      margin-bottom: 20px;
    }
    

    .viewtrusted {
      display: inline-block;
      background-color: rgb(220, 167, 235);
      padding: 15px 20px;
      color: black;
      text-decoration: none;
      border-radius: 5px;
      margin-bottom: 20px;
    }

    #message {
      text-align: center;
      margin-top: 10px;
      font-weight: bold;
    }

    /* MODAL */

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      width: 500px;
      max-width: 90%;
      padding: 25px;
      border-radius: 10px;
      position: relative;
      animation: popup 0.3s ease;
    }

    @keyframes popup {
      from {
        transform: scale(0.8);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .close-btn {
      position: absolute;
      top: 12px;
      right: 18px;
      font-size: 24px;
      cursor: pointer;
      color: #444;
    }

    .close-btn:hover {
      color: red;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
    }

    .form-group textarea {
      resize: vertical;
      height: 100px;
    }

    .update-btn {
      width: 100%;
      padding: 12px;
      background: #007bff;
      border: none;
      color: white;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    .update-btn:hover {
      background: #0056b3;
    }
  </style>
  <link rel="stylesheet" href="../css/admin-view.css">
</head>

<body>

  <div class="student-list">

    <a class="addmore" href="../trustedbrands.html">
      Add More Trusted Brands
    </a>

    
    <a class="viewtrusted" href="/index.html#trusted">
      view trusted brands section
    </a>


    <h2>Registered Trusted Brands</h2>

    <p id="message"></p>

    <table>

      <thead>
        <tr>
          <th>ID</th>
          <th>City</th>
          <th>Username</th>
          <th>Description</th>
          <th>Image</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody id="trustedBody">
        <tr>
          <td colspan="6">Loading Trusted Brands...</td>
        </tr>
      </tbody>

    </table>

  </div>

  <!-- MODAL -->

  <div class="modal" id="editModal">

    <div class="modal-content">

      <span class="close-btn" onclick="closeModal()">
        &times;
      </span>

      <h2>Edit Trusted Brand</h2>

      <form id="trustedEditForm" enctype="multipart/form-data">

        <div class="form-group">

          <label>City</label>

          <input
            type="text"
            id="city"
            name="city"
            required
          >

        </div>

        <div class="form-group">

          <label>Username</label>

          <input
            type="text"
            id="username"
            name="username"
            required
          >

        </div>

        <div class="form-group">

          <label>Description</label>

          <textarea
            id="description"
            name="description"
            required
          ></textarea>

        </div>

        <div class="form-group">

          <label>Current Image</label>

          <div id="currentImage">
            No image uploaded
          </div>

        </div>

        <div class="form-group">

          <label>Change Trusted Image</label>

          <input
            type="file"
            id="trustedimage"
            name="trustedimage"
            accept="image/*"
          >

        </div>

        <button type="submit" class="update-btn">
          Update Trusted Brand
        </button>

      </form>

    </div>

  </div>

  <script>

    const trustedBody = document.getElementById("trustedBody");

    const message = document.getElementById("message");

    const editModal =
      document.getElementById("editModal");

    const trustedForm =
      document.getElementById("trustedEditForm");

    let currentTrustedId = null;

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function imageUrl(value) {
      if (!value) return "";
      if (/^(https?:)?\/\//.test(value) || value.startsWith("/")) return value;
      return `/uploads/${value}`;
    }

    function trustedImage(src, username) {

      if (!src) {
        return "No Image";
      }

      return `
        <img src="${escapeHtml(imageUrl(src))}" alt="${escapeHtml(username)}">
      `;
    }

    async function loadTrustedBrands() {

      trustedBody.innerHTML = `
        <tr>
          <td colspan="6">Loading Trusted Brands...</td>
        </tr>
      `;

      try {

        const response = await fetch("/trusted");

        if (!response.ok) {
          throw new Error("Failed to fetch trusted brands");
        }

        const trusted = await response.json();

        trustedBody.innerHTML = "";

        if (trusted.length === 0) {

          trustedBody.innerHTML = `
            <tr>
              <td colspan="6">No Trusted Brands Found</td>
            </tr>
          `;

          return;
        }

        trusted.forEach((brand) => {

          const row = document.createElement("tr");

          row.innerHTML = `
            <td>${escapeHtml(brand.id)}</td>

            <td>${escapeHtml(brand.city)}</td>

            <td>${escapeHtml(brand.username)}</td>

            <td>${escapeHtml(brand.description)}</td>

            <td>
              ${trustedImage(
                brand.trustedimage,
                brand.username
              )}
            </td>

            <td>

              <button 
                class="btn-edit"
                onclick="editTrusted(${brand.id})"
              >
                Edit
              </button>

              <button 
                class="btn-delete"
                onclick="deleteTrusted(${brand.id})"
              >
                Delete
              </button>

            </td>
          `;

          trustedBody.appendChild(row);

        });

      } catch (error) {

        console.error(error);

        trustedBody.innerHTML = `
          <tr>
            <td colspan="6">
              Error Loading Trusted Brands
            </td>
          </tr>
        `;
      }
    }

    async function editTrusted(id) {

      currentTrustedId = id;

      editModal.style.display = "flex";

      try {

        const response =
          await fetch(`/trusted/${id}`);

        const trusted = await response.json();

        document.getElementById("city").value =
          trusted.city || "";

        document.getElementById("username").value =
          trusted.username || "";

        document.getElementById("description").value =
          trusted.description || "";

        const currentImage =
          document.getElementById("currentImage");

        if (trusted.trustedimage) {

          currentImage.innerHTML = `
            <img 
              src="${escapeHtml(imageUrl(trusted.trustedimage))}"
              alt="${escapeHtml(trusted.username)}"
              style="
                width:200px;
                height:120px;
                border-radius:8px;
              "
            >
          `;

        } else {

          currentImage.innerHTML =
            "No image uploaded";
        }

      } catch (error) {

        console.error(error);

        message.textContent =
          "Error loading trusted brand details";
      }
    }

    function closeModal() {

      editModal.style.display = "none";
    }

    trustedForm.addEventListener("submit", async (e) => {

      e.preventDefault();

      const formData = new FormData();

      formData.append(
        "city",
        document.getElementById("city").value.trim()
      );

      formData.append(
        "username",
        document.getElementById("username").value.trim()
      );

      formData.append(
        "description",
        document.getElementById("description").value.trim()
      );

      const imageFile =
        document.getElementById("trustedimage").files[0];

      if (imageFile) {

        formData.append(
          "trustedimage",
          imageFile
        );
      }

      try {

        const response = await fetch(
          `/trusted/${currentTrustedId}`,
          {
            method: "PUT",
            body: formData
          }
        );

        const data = await response.json();

        if (response.ok) {

          message.textContent =
            "Trusted Brand updated successfully";

          closeModal();

          loadTrustedBrands();

        } else {

          message.textContent =
            data.message || "Update failed";
        }

      } catch (error) {

        console.error(error);

        message.textContent =
          "Error updating trusted brand";
      }

    });

    async function deleteTrusted(id) {

      const confirmDelete = confirm(
        "Are you sure you want to delete this trusted brand?"
      );

      if (!confirmDelete) return;

      try {

        const response = await fetch(
          `/trusted/${id}`,
          {
            method: "DELETE"
          }
        );

        const data = await response.json();

        if (response.ok) {

          message.textContent = data.message;

          loadTrustedBrands();

        } else {

          message.textContent =
            data.message || "Delete failed";
        }

      } catch (error) {

        console.error(error);

        message.textContent =
          "Error deleting trusted brand";
      }
    }

    window.onclick = function (e) {

      if (e.target === editModal) {

        closeModal();
      }
    };

    loadTrustedBrands();

  </script>

</body>

</html>
