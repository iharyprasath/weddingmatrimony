  <!-- RIGHT SIDE -->
  <div class="main-content">

    <div class="admin-container">

      <h1>Service Section Admin</h1>

      <form id="serviceForm"
            enctype="multipart/form-data">

        <div class="form-group">

          <label>Title</label>

          <input
            type="text"
            name="title"
            placeholder="Title"
            required
          >

        </div>



        <div class="form-group">

          <label>Description</label>

          <input
            name="description"
            placeholder="Description"
            required
          >

        </div>



        <div class="form-group">

          <label>Button Text</label>

          <input
            name="buttontext"
            placeholder="Button Text"
            required
          >

        </div>



        <div class="form-group">

          <label>Service Image</label>

          <input
            class="file-input"
            type="file"
            name="service_image"
          >

        </div>



        <button type="submit">

          Save Service

        </button>

        <div id="adminchange"></div>

      </form>

    </div>

  </div>

</div>
  <script>
  // const adminChangeDiv = document.getElementById("adminchange");
  // adminChangeDiv.textContent = "Admin Dashboard - Add Service Slide";

  const form = document.getElementById("serviceForm");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const formData = new FormData(form);

    const response = await fetch("/services", {
      method: "POST",
      body: formData
    });

    const data = await response.json();

    console.log(data);

    if (!response.ok) {
      alert(data.message || "Service not saved");
      return;
    }

    form.reset();

    alert(data.message || "Service Saved");

    window.location.href = "/admin/adminview/serviceview.html";
  });
</script>

<script src="js/admin-menu.js"></script>
