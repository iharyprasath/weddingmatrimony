<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="css/admin.css">
  <meta charset="UTF-8">

</head>

<body>
<button class="admin-menu-toggle" type="button" aria-label="Toggle admin menu" aria-expanded="false"><span></span></button>
<div class="sidebar-overlay" aria-hidden="true"></div>
<div class="dashboard">

    <!-- SIDEBAR -->
    <aside class="sidebar">

      <div class="sidebar-header">
  <button class="sidebar-close">✕</button>
</div>

      <div class="logo">
        <h2>Admin Panel</h2>
      </div>

      <ul class="menu">

        <li class="active">
          <a href="admin.html">Hero </a>
        </li>

        <li>
          <a href="service.html">Services</a>
        </li>

        <li>
          <a href="trustedbrands.html">Trusted Brands</a>

        <li>
          <a href="blog.html">Blog</a>

        <li>
          <a href="welcomesection.html">Welcome Section</a>
        </li>

        <!-- <li>
  <a href="/admin/adminview/heroview.html">back to view</a>
</li> -->


      </ul>

    </aside>




  <!-- RIGHT SIDE -->
  <div class="main-content">

    <div class="admin-container">

      <h1>Hero Section Admin</h1>

      <form id="heroForm"
            enctype="multipart/form-data">

        <div class="form-group">

          <label>Title</label>

          <input
            type="text"
            name="title"
            placeholder="Title"
            required
          >

        </div>



        <div class="form-group">

          <label>Subtitle</label>

          <input
            type="text"
            name="subtitle"
            placeholder="Subtitle"
            required
          >

        </div>



        <div class="form-group">

          <label>Description</label>

          <textarea
            name="description"
            placeholder="Description"
            required
          ></textarea>

        </div>



        <div class="form-group">

          <label>Banner Image</label>

          <input
            class="file-input"
            type="file"
            name="banner_image"
          >

        </div>



        <button type="submit">

          Save Hero

        </button>

        <div id="adminchange"></div>

      </form>

    </div>

  </div>

</div>
  <script>
    // const adminChangeDiv = document.getElementById("adminchange");
    // adminChangeDiv.textContent = "Admin Dashboard - Edit Hero Section";
    const form = document.getElementById("heroForm");




    form.addEventListener("submit", async (e) => {

      e.preventDefault();

      const formData = new FormData(form);

      const response = await fetch("/heroes", {
        method : "POST",
        body: formData
      });

      const data = await response.json();

      console.log(data);

      form.reset();

      alert(data.message || "Hero Saved");

      window.location.href = "/admin/adminview/heroview.html";

    });

  </script>

<script src="js/admin-menu.js"></script>
</body>
